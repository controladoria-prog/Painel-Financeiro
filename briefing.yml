name: Briefing executivo (10h)

# Porto Velho é UTC-4 (sem horário de verão): 14:07 UTC = 10:07 lá, de segunda a sexta. O GitHub pode
# atrasar o agendamento (hoje atrasou 4h); por isso há dois disparos e o envio é idempotente.
on:
  schedule:
    - cron: "7 14 * * 1-5"    # 10:07 em Porto Velho
    - cron: "45 14 * * 1-5"   # 10:45: rede de segurança -- se o das 10:07 já saiu, este fica quieto
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reenviar mesmo que o de hoje já tenha saído"
        type: boolean
        default: false

# O robô grava o histórico do dia de volta no repositório (dados/historico_briefing.json).
permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet pandas numpy openpyxl

      - name: Calcular e enviar o briefing
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          FECHAMENTO_CSV_URL: ${{ secrets.FECHAMENTO_CSV_URL }}
          LINK_PAINEL: ${{ secrets.LINK_PAINEL }}
        run: python briefing.py ${{ github.event.inputs.forcar == 'true' && '--forcar' || '' }}

      - name: Guardar o histórico do dia
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          if [ -f dados/historico_briefing.json ]; then git add dados/historico_briefing.json; fi
          git commit -m "Histórico do briefing $(date -u +%d/%m/%Y)" || echo "sem mudança no histórico"
          git pull --rebase origin main
          git push origin HEAD:main
