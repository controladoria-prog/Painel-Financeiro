name: Board pack do fechamento

# Dia 5 de cada mês às 12:00 UTC (8h em Porto Velho), ou quando disparado à mão.
on:
  schedule:
    - cron: "7 12 5 * *"
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet pandas numpy openpyxl python-pptx

      - name: Gerar e enviar o board pack
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          FECHAMENTO_CSV_URL: ${{ secrets.FECHAMENTO_CSV_URL }}
          LINK_PAINEL: ${{ secrets.LINK_PAINEL }}
        run: python board_pack.py
